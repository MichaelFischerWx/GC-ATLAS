# GC-ATLAS — ERA5 climatology variable inventory
# ------------------------------------------------------------
# Consumed by pipeline/download_era5.py and pipeline/build_climatology.py.
# Edit here to add/remove fields from the Phase 1 core set.
# ------------------------------------------------------------

period:
  start: 1991
  end: 2020

grid: 0.5   # degrees; CDS regrids on the server
area: [90, -180, -90, 180]  # N, W, S, E — global

# Pressure levels (hPa) used for all pressure-level variables
pressure_levels:
  - 10
  - 50
  - 100
  - 150
  - 200
  - 250
  - 300
  - 500
  - 700
  - 850
  - 925
  - 1000

datasets:

  # ── 3D fields on pressure levels ────────────────────────────
  pressure_levels:
    dataset: reanalysis-era5-pressure-levels-monthly-means
    variables:
      - short: u
        cds_name: u_component_of_wind
        long:    Eastward wind
        units:   m s-1
      - short: v
        cds_name: v_component_of_wind
        long:    Northward wind
        units:   m s-1
      - short: w
        cds_name: vertical_velocity
        long:    Vertical velocity (omega)
        units:   Pa s-1
      - short: t
        cds_name: temperature
        long:    Temperature
        units:   K
      - short: z
        cds_name: geopotential
        long:    Geopotential
        units:   m2 s-2
      - short: q
        cds_name: specific_humidity
        long:    Specific humidity
        units:   kg kg-1
      - short: r
        cds_name: relative_humidity
        long:    Relative humidity
        units:   '%'
      - short: d
        cds_name: divergence
        long:    Horizontal divergence
        units:   s-1
      - short: vo
        cds_name: vorticity
        long:    Relative vorticity
        units:   s-1
      - short: pv
        cds_name: potential_vorticity
        long:    Potential vorticity
        units:   K m2 kg-1 s-1
      # NOTE: ERA5 monthly_averaged_reanalysis does NOT serve velocity_potential
      # or stream_function (they exist only in 6-hourly ERA5). We compute them
      # from u, v via spherical-harmonic Helmholtz decomposition — see
      # pipeline/build_helmholtz.py. Tiles land in
      # data/tiles/pressure_levels/{chi,psi}/ to match the regular tile layout.

  # ── 2D surface / single-level fields ────────────────────────
  single_levels:
    dataset: reanalysis-era5-single-levels-monthly-means
    variables:
      - short: msl
        cds_name: mean_sea_level_pressure
        long:    Mean sea level pressure
        units:   Pa
      - short: sp
        cds_name: surface_pressure
        long:    Surface pressure
        units:   Pa
      - short: t2m
        cds_name: 2m_temperature
        long:    2-metre temperature
        units:   K
      - short: d2m
        cds_name: 2m_dewpoint_temperature
        long:    2-metre dewpoint temperature
        units:   K
      - short: u10
        cds_name: 10m_u_component_of_wind
        long:    10-metre eastward wind
        units:   m s-1
      - short: v10
        cds_name: 10m_v_component_of_wind
        long:    10-metre northward wind
        units:   m s-1
      - short: sst
        cds_name: sea_surface_temperature
        long:    Sea surface temperature
        units:   K
      - short: tcwv
        cds_name: total_column_water_vapour
        long:    Total column water vapour
        units:   kg m-2
      - short: tp
        cds_name: total_precipitation
        long:    Total precipitation
        units:   m
      - short: sshf
        cds_name: surface_sensible_heat_flux
        long:    Surface sensible heat flux
        units:   J m-2
      - short: slhf
        cds_name: surface_latent_heat_flux
        long:    Surface latent heat flux
        units:   J m-2
      - short: ssr
        cds_name: surface_net_solar_radiation
        long:    Surface net shortwave radiation
        units:   J m-2
      - short: str
        cds_name: surface_net_thermal_radiation
        long:    Surface net longwave radiation
        units:   J m-2
      - short: tisr
        cds_name: toa_incident_solar_radiation
        long:    TOA incident solar radiation
        units:   J m-2
      - short: ttr
        cds_name: top_net_thermal_radiation
        long:    TOA net longwave radiation
        units:   J m-2
      - short: blh
        cds_name: boundary_layer_height
        long:    Planetary boundary layer height
        units:   m
      - short: ews
        cds_name: eastward_turbulent_surface_stress
        long:    Eastward turbulent surface stress
        units:   N m-2 s
      - short: oro
        cds_name: geopotential
        long:    Surface geopotential (model orography)
        units:   m2 s-2

      # ── Energy balance + column transports (added 2026-10-10) ──
      # Short names are the ECMWF ones and must stay underscore-free:
      # build_tiles.py takes the text after the last "_" of
      # era5_<group>_<short>.nc as the variable name.
      #
      # TOA radiation: accumulated, like tisr/ttr — monthly means hold the
      # mean DAILY accumulation (J m-2); era5.js divides by 86400 → W m-2.
      - short: tsr
        cds_name: top_net_solar_radiation
        long:    TOA net shortwave radiation (absorbed solar)
        units:   J m-2
      - short: tsrc
        cds_name: top_net_solar_radiation_clear_sky
        long:    TOA net shortwave radiation, clear sky
        units:   J m-2
      - short: ttrc
        cds_name: top_net_thermal_radiation_clear_sky
        long:    TOA net longwave radiation, clear sky
        units:   J m-2
      # Vertical integrals: instantaneous fields computed on model levels, so
      # the monthly mean is the mean of the HOURLY products — it includes the
      # transient-eddy covariances that monthly-mean u, v, T, q cannot.
      # No unit conversion. Not mass-consistent: zonally integrated transports
      # need the barotropic mass correction applied in js/transport.js.
      - short: vitoee
        cds_name: vertical_integral_of_eastward_total_energy_flux
        long:    Vertical integral of eastward total energy flux
        units:   W m-1
      - short: vitoen
        cds_name: vertical_integral_of_northward_total_energy_flux
        long:    Vertical integral of northward total energy flux
        units:   W m-1
      - short: vithen
        cds_name: vertical_integral_of_northward_heat_flux
        long:    Vertical integral of northward heat flux
        units:   W m-1
      - short: vign
        cds_name: vertical_integral_of_northward_geopotential_flux
        long:    Vertical integral of northward geopotential flux
        units:   W m-1
      - short: viken
        cds_name: vertical_integral_of_northward_kinetic_energy_flux
        long:    Vertical integral of northward kinetic energy flux
        units:   W m-1
      - short: viwve
        cds_name: vertical_integral_of_eastward_water_vapour_flux
        long:    Vertical integral of eastward water vapour flux
        units:   kg m-1 s-1
      - short: viwvn
        cds_name: vertical_integral_of_northward_water_vapour_flux
        long:    Vertical integral of northward water vapour flux
        units:   kg m-1 s-1
      - short: vimae
        cds_name: vertical_integral_of_eastward_mass_flux
        long:    Vertical integral of eastward mass flux
        units:   kg m-1 s-1
      - short: viman
        cds_name: vertical_integral_of_northward_mass_flux
        long:    Vertical integral of northward mass flux
        units:   kg m-1 s-1
      - short: viwvd
        cds_name: vertical_integral_of_divergence_of_moisture_flux
        long:    Vertical integral of divergence of moisture flux
        units:   kg m-2 s-1
      - short: vitoed
        cds_name: vertical_integral_of_divergence_of_total_energy_flux
        long:    Vertical integral of divergence of total energy flux
        units:   W m-2
